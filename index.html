<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1F5; --surface:#FFFFFF; --ink:#16213A; --muted:#5B6782; --line:#D5DBE5;
  --denim:#1F3A68; --denim-2:#2E5590; --thread:#D9A441; --good:#1F7A4D; --bad:#B23A3A; --soft:#E5EAF2;
  --on-denim:#F3F6FB;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0D1422; --surface:#151F35; --ink:#E8EDF6; --muted:#9AA7C0; --line:#28365A;
    --denim:#22406F; --denim-2:#6B95DA; --thread:#E3B45A; --good:#4CC08A; --bad:#E57373; --soft:#1C2944;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1422; --surface:#151F35; --ink:#E8EDF6; --muted:#9AA7C0; --line:#28365A;
  --denim:#22406F; --denim-2:#6B95DA; --thread:#E3B45A; --good:#4CC08A; --bad:#E57373; --soft:#1C2944;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:Barlow,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.45;
  -webkit-text-size-adjust:100%;}
.num,.big,h1,h2,.tabbar button,.kv b{font-family:"Barlow Condensed","Arial Narrow",Barlow,system-ui,sans-serif;}
.wrap{max-width:560px;margin:0 auto;padding:14px 14px 96px;}
header.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 2px 12px;}
header.top h1{font-size:24px;line-height:1.1;margin:0;font-weight:700;letter-spacing:.2px;}
header.top .sub{color:var(--muted);font-size:13px}
.status{font-size:12px;color:var(--muted);text-align:right;min-height:1em}
.monthbar{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.monthbar button{flex:0 0 40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:18px;cursor:pointer}
.monthbar .label{flex:1;text-align:center;font-family:"Barlow Condensed",Barlow,sans-serif;font-size:20px;font-weight:600}
.monthbar .label small{display:block;font-family:Barlow,sans-serif;font-size:12px;color:var(--muted);font-weight:500}

/* Signature: the stitched denim panel */
.hero{background:var(--denim);color:var(--on-denim);border-radius:18px;padding:20px 20px 18px;position:relative;
  outline:1.5px dashed var(--thread);outline-offset:-9px;margin-bottom:14px}
.hero .lbl{font-size:13px;opacity:.85}
.hero .big{font-size:46px;line-height:1;font-weight:700;margin:4px 0 10px;letter-spacing:.3px}
.hero .of{font-size:15px;opacity:.85}
.bar{height:10px;border-radius:6px;background:rgba(255,255,255,.18);overflow:hidden;margin:12px 0 12px}
.bar i{display:block;height:100%;background:var(--thread);border-radius:6px}
.hero .row{display:flex;gap:18px;flex-wrap:wrap}
.hero .row div{font-size:13px;opacity:.9}
.hero .row b{display:block;font-family:"Barlow Condensed",Barlow,sans-serif;font-size:24px;font-weight:600;opacity:1}

section.block{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
section.block h2{font-size:19px;margin:0 0 10px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kv{background:var(--soft);border-radius:10px;padding:10px}
.kv span{display:block;font-size:12px;color:var(--muted)}
.kv b{font-size:22px;font-weight:600}
.up{color:var(--good)} .down{color:var(--bad)}
.muted{color:var(--muted)}
.hint{font-size:13px;color:var(--muted);margin:6px 0 0}

.chart{display:flex;align-items:flex-end;gap:5px;height:150px;padding-top:8px}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;cursor:pointer;background:none;border:0;padding:0;color:inherit}
.chart .stack{position:relative;width:100%;flex:1;display:flex;align-items:flex-end;justify-content:center}
.chart .s{width:58%;background:var(--denim-2);border-radius:4px 4px 0 0;min-height:2px}
.chart .ly{position:absolute;left:50%;transform:translateX(-50%);width:84%;border:1.5px dashed var(--muted);border-bottom:0;border-radius:4px 4px 0 0;bottom:0;pointer-events:none}
.chart .col.sel .s{background:var(--thread)}
.chart .m{font-size:11px;color:var(--muted)}
.chart.wk{gap:1px}
.chart.wk .s{width:80%;border-radius:2px 2px 0 0}
.chart.wk .ly{width:100%;border-width:1px}
.chart.wk .m{font-size:9px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:12px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

.rank{list-style:none;margin:0;padding:0}
.rank li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.rank li:first-child{border-top:0}
.rank .pos{width:26px;height:26px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-weight:600;font-size:13px;flex:0 0 26px}
.rank .who{flex:1;min-width:0}
.rank .who b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank .who small{color:var(--muted);font-size:12px}
.rank .amt{text-align:right}
.rank .amt b{font-family:"Barlow Condensed",Barlow,sans-serif;font-size:20px;font-weight:600;display:block}
.rank .amt small{font-size:12px}
.minibar{height:5px;background:var(--soft);border-radius:3px;margin-top:5px;overflow:hidden}
.minibar i{display:block;height:100%;background:var(--denim-2)}

details.staff{border-top:1px solid var(--line)}
details.staff:first-of-type{border-top:0}
details.staff summary{list-style:none;cursor:pointer}
details.staff summary::-webkit-details-marker{display:none}
.mtable{font-size:13px;margin:4px 0 10px}

label.f{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
input[type=text],input[type=number],input.n{width:100%;font:inherit;font-size:16px;padding:10px 11px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
input:focus-visible,button:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--thread);outline-offset:2px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.srow{border-top:1px solid var(--line);padding:12px 0}
.srow:first-of-type{border-top:0;padding-top:2px}
.srow .name{font-weight:600;margin-bottom:8px}
.sgrid{display:grid;grid-template-columns:.75fr 1.25fr 1.25fr .85fr .85fr;gap:6px}
.sgrid input{padding:9px 7px;font-size:15px}
.sgrid label.f{font-size:11px;margin-bottom:2px}
.btn{font:inherit;font-weight:600;border-radius:10px;padding:11px 14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn.primary{background:var(--denim);color:var(--on-denim);border-color:var(--denim)}
.btn.small{padding:7px 10px;font-size:13px}
.btn.danger{color:var(--bad)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.sticky-save{position:sticky;bottom:calc(72px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;padding:10px 0 0;background:linear-gradient(to top,var(--bg) 70%,transparent)}
.sticky-save .btn{flex:1;padding:14px}

.seg{display:flex;background:var(--soft);border-radius:10px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;color:var(--muted);font:inherit;font-weight:600;padding:8px;border-radius:8px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink)}

.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -14px;padding:0 14px}
table{border-collapse:collapse;width:100%;font-size:14px;white-space:nowrap}
th,td{padding:8px 8px;text-align:right;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--surface)}
th{font-size:12px;color:var(--muted);font-weight:600}
tr.total td{font-weight:700;border-bottom:0;border-top:2px solid var(--ink)}
td.empty{color:var(--muted)}

.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
.tabbar .in{max-width:560px;margin:0 auto;display:grid;grid-auto-flow:column;grid-auto-columns:1fr}
.tabbar button[hidden]{display:none}
.tabbar button{border:0;background:none;color:var(--muted);font-size:14px;font-weight:600;padding:10px 4px 12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.tabbar button svg{width:22px;height:22px}
.tabbar button[aria-current="page"]{color:var(--denim-2)}
.tabbar button[aria-current="page"] svg{stroke:var(--thread)}

.folders{display:grid;gap:12px}
.gate{text-align:left;margin-top:8vh}
.gate .logo{width:72px;height:72px;border-radius:16px;background:var(--denim);color:var(--on-denim);display:grid;place-items:center;font-family:"Barlow Condensed",Barlow,sans-serif;font-weight:700;font-size:26px;outline:1.5px dashed var(--thread);outline-offset:-6px;margin-bottom:14px}
.gate label.f{margin-top:12px}
.gate hr{border:0;border-top:1px solid var(--line);margin:18px 0}
textarea{width:100%;font:inherit;font-size:14px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);min-height:120px}
.badge{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--muted);margin-left:6px;vertical-align:2px}
.folder{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:18px 16px;cursor:pointer;font:inherit}
.folder .ficon{font-size:32px;line-height:1}
.folder .ftxt{flex:1;min-width:0}.folder b{display:block;font-family:"Barlow Condensed",Barlow,sans-serif;font-size:22px;font-weight:600}
.folder small{color:var(--muted);font-size:13px}
.chev{color:var(--muted);font-size:24px;line-height:1}
.back{border:0;background:none;color:var(--denim-2);font:inherit;font-weight:600;font-size:16px;padding:4px 0 12px;cursor:pointer}
.rowbtn{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;color:inherit;font:inherit;text-align:left;padding:0;cursor:pointer}

<script>
window.addEventListener("error",function(e){if(!e||/^Script error\.?$/i.test(String(e.message||""))||(e.filename&&e.filename.indexOf(location.origin)!==0))return;try{var v=document.getElementById("view");if(v&&!v.dataset.err){v.dataset.err="1";v.insertAdjacentHTML("afterbegin",'<div style="background:#B23A3A;color:#fff;padding:12px;border-radius:10px;margin-bottom:12px;font-size:14px">Something went wrong: '+String(e.message||e).replace(/</g,"&lt;")+'<br>Take a screenshot and send it to fix.</div>');}}catch(_){}});
window.addEventListener("unhandledrejection",function(e){try{console.warn(e.reason);}catch(_){}});
(function(){
const LS_KEY = "store-perf-v1";
const MN = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const MN_FULL = ["January","February","March","April","May","June","July","August","September","October","November","December"];

let state = {storeName:"Levi's PMC", staff:[], months:{}, settings:{lateAfter:"10:15"}, incentives:{}};
let docRef = null, col = null;
const dayCache = {};
const LS_DAY = "store-perf-day-";
let downloads = null;
const now = new Date();
const ui = {tab:"home", mode:"month", dday: todayISO(), week: weekOfDate(now), month: null, staffView:"month", day: todayISO()};

/* ---------- helpers ---------- */
function keyOf(y,m){return y+"-"+String(m).padStart(2,"0");}
function parseKey(k){const [y,m]=k.split("-").map(Number);return {y,m};}
function addMonths(k,d){const {y,m}=parseKey(k);const t=y*12+(m-1)+d;return keyOf(Math.floor(t/12),t%12+1);}
function isWeek(k){return String(k).indexOf("W")>-1;}
function isDay(k){return /^\d{4}-\d{2}-\d{2}$/.test(String(k));}
function dOf(k){return new Date(+k.slice(0,4),+k.slice(5,7)-1,+k.slice(8,10));}
function dayAdd(k,n){const d=dOf(k);return isoOf(new Date(d.getFullYear(),d.getMonth(),d.getDate()+n));}
const WD=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
/* Levi's fiscal year: Dec–Nov, named by the year it ends (FY2026 = Dec 2025 – Nov 2026) */
function fyOf(k){if(isDay(k))return Number(weekOfDate(dOf(k)).slice(0,4));if(isWeek(k))return Number(k.slice(0,4));const {y,m}=parseKey(k);return m===12?y+1:y;}
function monthKeys(fy){const a=[keyOf(fy-1,12)];for(let m=1;m<=11;m++)a.push(keyOf(fy,m));return a;}
function weekKey(fy,n){return fy+"-W"+String(n).padStart(2,"0");}
function weekNo(k){return Number(k.slice(6));}
function fyStart(fy){const d=new Date(fy-1,10,30);return new Date(fy-1,10,30-d.getDay()+1);} /* Monday after last Sunday of November */
function weeksIn(fy){return Math.round((fyStart(fy+1)-fyStart(fy))/(7*864e5));}
function weekKeys(fy){const a=[],w=weeksIn(fy);for(let n=1;n<=w;n++)a.push(weekKey(fy,n));return a;}
function dayKeys(fy){const out=[];const s=fyStart(fy),e=fyStart(fy+1);for(let d=new Date(s);d<e;d=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1))out.push(isoOf(d));return out;}
function periodKeys(fy){return (ui.mode==="week"||ui.mode==="ytd")?weekKeys(fy):ui.mode==="day"?dayKeys(fy):monthKeys(fy);}
/* Levi's fiscal months: 5-4-4 weeks each quarter (Dec, Mar, Jun, Sep = 5 weeks). A 53rd week goes to November. */
const FM_WEEKS=[5,4,4,5,4,4,5,4,4,5,4,4];
function fmIndex(k){const {m}=parseKey(k);return m===12?0:m;}
function fmWeeks(k){const fy=fyOf(k),i=fmIndex(k);let st=1;for(let j=0;j<i;j++)st+=FM_WEEKS[j];let n=FM_WEEKS[i];if(i===11)n=weeksIn(fy)-48;return [st,st+n-1];}
function fmRange(k){const fy=fyOf(k),[a,b]=fmWeeks(k);return [weekRange(weekKey(fy,a))[0],weekRange(weekKey(fy,b))[1]];}
function monthOfDate(d){const wk=weekOfDate(d),fy=Number(wk.slice(0,4)),n=weekNo(wk);let acc=0;
  for(let i=0;i<12;i++){acc+=(i===11?weeksIn(fy)-48:FM_WEEKS[i]);if(n<=acc)return i===0?keyOf(fy-1,12):keyOf(fy,i);}return keyOf(fy,11);}
function datesBetween(s,e){const out=[];for(let d=new Date(s);d<=e;d=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1))out.push(isoOf(d));return out;}
function monthDays(k){const [s,e]=fmRange(monthOfDate(dOf(k)));return datesBetween(s,e);}
async function dayObjsBetween(s,e){const out=[];for(const dt of datesBetween(s,e)){const c=await loadX24(dt.slice(0,7));if(c.days[dt])out.push(c.days[dt]);}return out;}
async function rebuildFiscalMonth(fm,msg){const [s,e]=fmRange(fm);mergeInto(fm,sumDays(await dayObjsBetween(s,e)),msg||"Updated");}
function chartKeys(k){return isDay(k)?monthDays(k):periodKeys(fyOf(k));}
function weekRange(k){const fy=fyOf(k),n=weekNo(k),st=fyStart(fy);const s=new Date(st.getFullYear(),st.getMonth(),st.getDate()+(n-1)*7);const e=new Date(s.getFullYear(),s.getMonth(),s.getDate()+6);return [s,e];}
function weekOfDate(d){const day=new Date(d.getFullYear(),d.getMonth(),d.getDate());let fy=d.getFullYear();if(day<fyStart(fy))fy--;if(day>=fyStart(fy+1))fy++;const days=Math.round((day-fyStart(fy))/864e5);return weekKey(fy,Math.floor(days/7)+1);}
function rangeText(k){const [s,e]=weekRange(k);const f=d=>d.getDate()+" "+MN[d.getMonth()];return f(s)+" – "+f(e);}
/* LY = same days 364 days back (same weekday), like the DSR. A 53-week year (FY2025) shifts week numbers, so weeks are matched by date, not by number. */
function lyWeek(k){const [s]=weekRange(k);return weekOfDate(new Date(s.getFullYear(),s.getMonth(),s.getDate()-364));}
function prevYearKey(k){if(isDay(k))return dayAdd(k,-364);if(isWeek(k))return lyWeek(k);const {y,m}=parseKey(k);return keyOf(y-1,m);}
function mShort(k){if(isDay(k)){const d=dOf(k);return d.getDate()+" "+MN[d.getMonth()];}if(isWeek(k))return "W"+weekNo(k);const {m}=parseKey(k);return MN[m-1];}
function mLong(k){if(isDay(k)){const d=dOf(k);return WD[d.getDay()]+", "+d.getDate()+" "+MN[d.getMonth()]+" "+d.getFullYear();}if(isWeek(k))return "Week "+weekNo(k)+" ("+rangeText(k)+")";const {y,m}=parseKey(k);return MN_FULL[m-1]+" "+y;}
function stepKey(k,d){if(isDay(k))return dayAdd(k,d);if(isWeek(k)){let fy=fyOf(k),n=weekNo(k)+d;if(n<1){fy--;n=weeksIn(fy);}else if(n>weeksIn(fy)){fy++;n=1;}return weekKey(fy,n);}return addMonths(k,d);}
function cur(){return (ui.mode==="week"||ui.mode==="ytd")?ui.week:ui.mode==="day"?ui.dday:ui.month;}
function isYtd(){return ui.mode==="ytd";}
function selKeys(){return isYtd()?ytdKeys(ui.week):[cur()];}
function ytdLabel(){const fy=fyOf(ui.week);return "YTD · Week 1 – Week "+weekNo(ui.week);}
function setCur(k){if(isDay(k))ui.dday=k;else if(isWeek(k))ui.week=k;else ui.month=k;}
function rec(k){if(isDay(k)){const c=x24Cache[k.slice(0,7)];return c?c.days[k]:undefined;}if(isWeek(k)){const c=weekCache[fyOf(k)];return c?c[k]:undefined;}const r=state.months[k];if(r&&(r.source||num(r.sales)>0))return r;const w=monthFromWeeks(k);if(r&&w)return {...w,target:num(r.target)||w.target};return r||w;}
/* a fiscal month with no month entry is built from its weeks (fiscal months are whole weeks) */
function monthFromWeeks(k){
  const fy=fyOf(k),c=weekCache[fy];if(!c)return undefined;
  const [a,b]=fmWeeks(k);const t={sales:0,target:0,bills:0,units:0,footfall:0,staff:{}};let any=false;
  for(let n=a;n<=b;n++){const r=c[weekKey(fy,n)];if(!r)continue;any=true;
    ["sales","target","bills","units","footfall"].forEach(f=>t[f]+=num(r[f]));
    Object.keys(r.staff||{}).forEach(id=>{const s=t.staff[id]||(t.staff[id]={sales:0,target:0,bills:0,units:0});["sales","target","bills","units"].forEach(f=>s[f]+=num(r.staff[id][f]));});}
  if(!any)return undefined;t.fromWeeks=true;return t;
}
function putRec(k,r,msg){if(isDay(k)){const mk=k.slice(0,7);const c=x24Cache[mk]||(x24Cache[mk]={days:{}});c.days[k]=r;persistX24(mk);toast(msg||"Saved");rebuildFromDay(k);return;}if(isWeek(k)){const fy=fyOf(k);(weekCache[fy]=weekCache[fy]||{})[k]=r;persistWeeks(fy,msg);}else{state.months[k]=r;persist(msg);}}
function delRec(k){if(isDay(k)){const c=x24Cache[k.slice(0,7)];if(c){delete c.days[k];persistX24(k.slice(0,7));toast("Cleared");rebuildFromDay(k);}return;}if(isWeek(k)){const fy=fyOf(k);if(weekCache[fy]){delete weekCache[fy][k];persistWeeks(fy,"Cleared");}}else{delete state.months[k];persist("Cleared");}}
const weekCache={}, weekLoading={};
const LS_WEEK="store-perf-weeks-";
async function loadWeeks(fy){
  if(weekCache[fy]) return;
  if(weekLoading[fy]) return weekLoading[fy];
  weekLoading[fy]=(async()=>{
    let d=null;
    try{const r=localStorage.getItem(LS_WEEK+fy);if(r)d=JSON.parse(r);}catch(e){}
    if(col){try{const s=await col.doc("weeks-"+fy).get();if(s.exists)d=JSON.parse(JSON.stringify(s.data()));}catch(e){}}
    weekCache[fy]=d&&typeof d==="object"?d:{};
  })();
  const pr=weekLoading[fy];pr.then(()=>{if(weekLoading[fy]===pr)delete weekLoading[fy];});
  return pr;
}
let weekChain=Promise.resolve();
function persistWeeks(fy,msg){
  if(!canEdit())return;
  const snap=JSON.parse(JSON.stringify(weekCache[fy]||{}));
  try{localStorage.setItem(LS_WEEK+fy,JSON.stringify(snap));}catch(e){}
  weekChain=weekChain.then(async()=>{
    if(!col){toast(msg||"Saved");return;}
    try{await col.doc("weeks-"+fy).set(snap);setStatus("Synced");toast(msg||"Saved");}
    catch(e){setStatus("Saved on this device only");toast("Saved on this device — sync failed");}
  });
}
function neededMonths(k){const s=fyStart(fyOf(k));const end=monthDays(k).pop();const set=new Set();
  for(let d=new Date(s);isoOf(d)<=end;d=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1)){const i=isoOf(d);set.add(i.slice(0,7));set.add(dayAdd(i,-364).slice(0,7));}return [...set];}
function weeksReady(){if(ui.mode==="day")return neededMonths(ui.dday).every(mk=>x24Cache[mk]);const fy=fyOf(cur());return !!(weekCache[fy]&&weekCache[fy-1]);}
function ensureWeeks(){if(ui.mode==="day"){Promise.all(neededMonths(ui.dday).map(loadX24)).then(()=>{if(ui.mode==="day"&&ui.tab!=="daily")render();});return;}const fy=fyOf(cur());
  Promise.all([loadWeeks(fy),loadWeeks(fy-1)]).then(()=>{if(ui.mode!=="day"&&ui.tab!=="daily")render();});}
function fyName(fy){return "FY "+fy+" (Dec "+String(fy-1).slice(2)+" – Nov "+String(fy).slice(2)+")";}
function num(v){const n=parseFloat(String(v??"").replace(/,/g,""));return isFinite(n)?n:0;}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function inr(n){
  n=num(n);const a=Math.abs(n),s=n<0?"-":"";
  if(a>=1e7) return s+"₹"+(a/1e7).toFixed(2)+" Cr";
  if(a>=1e5) return s+"₹"+(a/1e5).toFixed(2)+" L";
  return s+"₹"+Math.round(a).toLocaleString("en-IN");
}
function full(n){return Math.round(num(n)).toLocaleString("en-IN");}
function pct(x,dp=0){return isFinite(x)? (x*100).toFixed(dp)+"%" : "–";}
function signPct(x){if(!isFinite(x))return "–";const v=(x*100).toFixed(1);return (x>0?"+":"")+v+"%";}
function cls(x){return !isFinite(x)?"":(x>=0?"up":"down");}
function uid(){return "s"+Math.random().toString(36).slice(2,9);}

/* ---------- metrics ---------- */
/* ---------- LY store: last year's daily sales uploaded separately (Sales tab → Upload LY report) ---------- */
let lyStore=null,lyLoaded=false;
async function loadLy(){
  if(lyLoaded) return lyStore;
  let d=null;
  try{const r=localStorage.getItem("store-perf-ly");if(r)d=JSON.parse(r);}catch(e){}
  if(col){try{const s=await col.doc("lydays").get();if(s.exists)d=JSON.parse(JSON.stringify(s.data()));}catch(e){}}
  lyStore=d&&d.days&&typeof d.days==="object"?d:{days:{}};lyLoaded=true;return lyStore;
}
function saveLy(msg){

function lyDayKeys(){return lyStore?Object.keys(lyStore.days).sort():[];}
/* last day that has this year's sales: LY of a running week/month stops there (like-for-like) */
function lyCap(){if(state.lastDataDate)return state.lastDataDate;const y=new Date();y.setDate(y.getDate()-1);return isoOf(y);}
function periodSpan(k){if(isDay(k))return [k,k];const [a,b]=isWeek(k)?weekRange(k):fmRange(k);return [isoOf(a),isoOf(b)];}
function lyFromStore(k){
  if(!lyStore||!lyDayKeys().length)return null;
  let [s,e]=periodSpan(k);const cap=lyCap();if(e>cap)e=cap;if(s>e)return null;
  let t=0,n=0;for(let d=s;d<=e;d=dayAdd(d,1)){const v=lyStore.days[dayAdd(d,-364)];if(v){t+=num(v[0]);n++;}}
  return n?t:null;
}
function lyAuto(k){
  if(!isWeek(k)&&!isDay(k)){
    const fy=fyOf(k),[a,b]=fmWeeks(k);let t=0;
    for(let n=a;n<=b;n++){const r=rec(lyWeek(weekKey(fy,n)));if(r)t+=num(r.sales);}
    if(t>0) return t;
  }
  const p=rec(prevYearKey(k));
  return p&&num(p.sales)>0?num(p.sales):0;
}
function lyAuto_(k){const v=lyFromStore(k);return v!=null?v:lyAuto(k);}
function lyFor(k){
  const st=lyFromStore(k);if(st!=null) return st;
  const a=lyAuto(k);if(a>0) return a;
  const m=rec(k); return m?num(m.lySales):0;
}
function derive(t){
  return {
    ...t,
    ach: t.target>0? (t.salesT||0)/t.target : NaN,
    atv: t.bills>0? t.sales/t.bills : NaN,
    upt: t.bills>0? t.units/t.bills : NaN,
    asp: t.units>0? t.sales/t.units : NaN,
    conv: t.footfall>0? t.bills/t.footfall : NaN,
    l2l: (t.lyMatched>0)? t.salesMatched/t.lyMatched - 1 : NaN
  };
}
function aggStore(keys){
  const t={sales:0,target:0,salesT:0,bills:0,units:0,footfall:0,ly:0,salesMatched:0,lyMatched:0};
  keys.forEach(k=>{
    const m=rec(k); if(!m) return;
    const s=num(m.sales), ly=lyFor(k);
    t.sales+=s; t.target+=num(m.target); if(num(m.target)>0)t.salesT+=s; t.bills+=num(m.bills); t.units+=num(m.units); t.footfall+=num(m.footfall);
    t.ly+=ly;
    if(s>0&&ly>0){t.salesMatched+=s;t.lyMatched+=ly;}
  });
  return derive(t);
}
function aggStaff(id,keys){
  const t={sales:0,target:0,salesT:0,bills:0,units:0,footfall:0,salesMatched:0,lyMatched:0};
  keys.forEach(k=>{
    const r=rec(k)?.staff?.[id]; if(!r) return;
    t.sales+=num(r.sales); t.target+=num(r.target); if(num(r.target)>0)t.salesT+=num(r.sales); t.bills+=num(r.bills); t.units+=num(r.units);
  });
  return derive(t);
}
/* YTD target: monthly targets (pro-rated for a part month) or, if a month has none, its weekly targets */
function ytdTarget(wk){
  const fy=fyOf(wk),cw=weekNo(wk),c=weekCache[fy]||{};let target=0,salesT=0;
  for(const fm of monthKeys(fy)){const [a,b]=fmWeeks(fm);if(a>cw)break;const e=Math.min(b,cw),n=b-a+1,cov=e-a+1;
    const mt=num(state.months[fm]?.target);let s=0,wt=0,ws=0;
    for(let i=a;i<=e;i++){const r=c[weekKey(fy,i)];if(!r)continue;s+=num(r.sales);if(num(r.target)>0){wt+=num(r.target);ws+=num(r.sales);}}
    if(mt>0){target+=mt*cov/n;salesT+=s;}else if(wt>0){target+=wt;salesT+=ws;}}
  return {target,salesT};
}
function withYtdTarget(a,wk){const t=ytdTarget(wk);a.target=t.target;a.salesT=t.salesT;a.ach=t.target>0?t.salesT/t.target:NaN;return a;}
function ytdKeys(k){const fy=fyOf(k);const all=periodKeys(fy);return all.slice(0,all.indexOf(k)+1);}
function staffWithData(keys){

function homeMix(s,e){const wks=weeksCovering(s,e);const miss=wks.filter(w=>!mixCache[w]);
  if(miss.length){Promise.all(miss.map(loadMix)).then(()=>{if(ui.tab==="home")render();});return null;}
  const si=isoOf(s),ei=isoOf(e),c={};wks.forEach(w=>Object.keys(mixCache[w].days||{}).forEach(dt=>{if(dt<si||dt>ei)return;const d=mixCache[w].days[dt].c||{};Object.keys(d).forEach(k=>{c[k]=(c[k]||0)+num(d[k][0]);});}));
  const tot=Object.values(c).reduce((x,v)=>x+v,0),g=k=>c[k]||0;
  return tot?{btm:(g("MENS BOTTOMS")+g("WOMENS BOTTOMS"))/tot,wms:(g("WOMENS TOPS")+g("WOMENS BOTTOMS"))/tot,tot}:{btm:NaN,wms:NaN,tot:0};}
function ytdAvgs(k,y){const fs=fyStart(fyOf(k));const [,pe]=periodDates(k,false);const end=pe<new Date()?pe:new Date();
  const days=Math.max(1,Math.round((end-fs)/864e5)+1);const wks=Math.max(1,days/7);
  const months=monthKeys(fyOf(k)).filter(m=>{const [a]=fmRange(m);return a<=end;}).length||1;
  return {wk:y.sales/wks,mo:y.sales/months,wks,months};}

  const miss=mks.filter(m=>!x24Cache[m]);if(miss.length){Promise.all(miss.map(loadX24)).then(()=>{if(ui.tab==="home")render();});return null;}
  const si=isoOf(s),ei=isoOf(e),t={q:0,v:0,b:0,days:0};

  const fm=monthOfDate(dOf(iso)),[fs]=fmRange(fm);await Promise.all([...new Set(datesBetween(fs,dOf(iso)).map(x=>x.slice(0,7)))].map(loadX24));const mt=aggStore(datesBetween(fs,dOf(iso)).map(x=>typeof x==="string"?x:isoOf(x)));const fr=rec(fm)||{};
  const wk=weekOfDate(dOf(iso));await loadBills(wk);const [wsD]=weekRange(wk);await Promise.all([...new Set(datesBetween(wsD,dOf(iso)).map(x=>x.slice(0,7)))].map(loadX24));
  const wt=aggStore(datesBetween(wsD,dOf(iso))),wr=rec(wk)||{};const bl=(billCache[wk]&&billCache[wk].days[iso])||[];
  const L=wowLevels(),wow=bl.filter(b=>b[1]>=L[0]).length;
  const sales=num(d.sales),bills=num(d.bills),units=num(d.units),ff=num(d.footfall),tg=num(d.target);
  const top=Object.keys(d.staff||{}).map(id=>({n:staffName(id),v:num(d.staff[id].sales)})).filter(x=>x.v>0).sort((a,b)=>b.v-a.v).slice(0,3);
  const k=v=>"₹"+(v>=1e5?(v/1e5).toFixed(2)+" L":v>=1e3?Math.round(v/1e3)+"k":full(Math.round(v)));
  const lines=[`*${state.storeName||"Levi's PMC"} · ${dayLabel(iso)}*`,
    `Sale ${k(sales)}${tg?" · Target "+k(tg)+" · Ach "+Math.round(sales/tg*100)+"%":""}`,
    `WTD (W${weekNo(wk)}) ${k(wt.sales)}${num(wr.target)?" / "+k(num(wr.target))+" · "+Math.round(wt.sales/num(wr.target)*100)+"%":""}`,
    `MTD ${k(mt.sales)}${num(fr.target)?" / "+k(num(fr.target))+" · "+Math.round(mt.sales/num(fr.target)*100)+"%":""}`,
    `Bills ${bills} · ATV ${bills?k(sales/bills):"–"} · UPT ${bills?(units/bills).toFixed(2):"–"}${ff?" · Conv "+(bills/ff*100).toFixed(1)+"%":""}`,
    `WOW bills ${wow}`];
  if(top.length)lines.push("Top: "+top.map(x=>x.n.split(" ")[0]+" "+k(x.v)).join(" · "));
  if(recs.chk)lines.push(`Checklist ${chkDone(iso)}/${CHK_ITEMS.length}`);

/* ---------- X24 import ---------- */
const x24Cache={};
const LS_X24="store-perf-x24-";
function pad2(n){return String(n).padStart(2,"0");}
function isoOf(d){return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate());}
const x24Loading={};
function loadX24(mk){
  if(x24Cache[mk]) return Promise.resolve(x24Cache[mk]);
  if(x24Loading[mk]) return x24Loading[mk];
  x24Loading[mk]=loadX24Raw(mk).then(d=>{delete x24Loading[mk];return d;});
  return x24Loading[mk];
}
async function loadX24Raw(mk){
  if(x24Cache[mk]) return x24Cache[mk];
  let d=null;
  try{const r=localStorage.getItem(LS_X24+mk);if(r)d=JSON.parse(r);}catch(e){}
  if(col){try{const s=await col.doc("x24-"+mk).get();if(s.exists)d=JSON.parse(JSON.stringify(s.data()));}catch(e){}}
  d=d&&typeof d==="object"?d:{};
  if(!d.days||typeof d.days!=="object")d.days={};
  x24Cache[mk]=d;return d;
}
let x24Chain=Promise.resolve();
function persistX24(mk){
  if(!canEdit())return;
  const snap=JSON.parse(JSON.stringify(x24Cache[mk]));
  try{localStorage.setItem(LS_X24+mk,JSON.stringify(snap));}catch(e){}
  x24Chain=x24Chain.then(async()=>{if(!col)return;try{await col.doc("x24-"+mk).set(snap);}catch(e){}});
}
function loadXLSX(){
  if(window.XLSX) return Promise.resolve(window.XLSX);
  return new Promise((res,rej)=>{const s=document.createElement("script");
    s.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
    s.onload=()=>res(window.XLSX);s.onerror=()=>rej(new Error("Could not load the Excel reader. Check your internet and try again."));
    document.head.appendChild(s);});
}
function normDate(v){
  if(v==null||v==="")return null;
  if(Object.prototype.toString.call(v)==="[object Date]"&&!isNaN(v))return isoOf(new Date(v.getTime()+43200000));
  if(typeof v==="number"&&window.XLSX){const p=XLSX.SSF.parse_date_code(v);if(p&&p.y)return p.y+"-"+pad2(p.m)+"-"+pad2(p.d);}
  const s=String(v).trim();let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);if(m)return m[1]+"-"+pad2(m[2])+"-"+pad2(m[3]);
  m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})/);if(m){let y=+m[3];if(y<100)y+=2000;return y+"-"+pad2(m[2])+"-"+pad2(m[1]);}
  return null;
}
function normName(s){return String(s||"").toLowerCase().replace(/[^a-z\s]/g," ").split(/\s+/).filter(Boolean);}
function matchStaff(reportName){
  const key=normName(reportName).join(" ");
  const al=state.staffAlias&&state.staffAlias[key];
  if(al&&state.staff.some(s=>s.id===al))return al;
  const rt=normName(reportName);
  for(const s of state.staff){const st=normName(s.name);if(st.join(" ")===key)return s.id;}
  for(const s of state.staff){const st=normName(s.name).filter(t=>t.length>=3);if(st.length&&st.every(t=>rt.includes(t)))return s.id;}
  for(const s of state.staff){const st=normName(s.name).filter(t=>t.length>=3);if(st.some(t=>rt.includes(t)))return s.id;}
  return null;
}
function titleCase(s){return String(s).trim().split(/\s+/).map(w=>w.charAt(0).toUpperCase()+w.slice(1).toLowerCase()).join(" ");}

function parseX24(XLSX,wb){
  const need=["TRANS DATE","TRANSNUM","NET SOLD QTY","TOTAL AMOUNT"];
  const names=[...wb.SheetNames].sort((a,b)=>(/x24|transaction/i.test(b)?1:0)-(/x24|transaction/i.test(a)?1:0));
  for(const name of names){
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,raw:true,defval:null});
    for(let i=0;i<Math.min(15,rows.length);i++){
      const hdr=(rows[i]||[]).map(x=>String(x??"").trim().toUpperCase());
      if(!need.every(n=>hdr.includes(n)))continue;
      const c={date:hdr.indexOf("TRANS DATE"),tn:hdr.indexOf("TRANSNUM"),qty:hdr.indexOf("NET SOLD QTY"),amt:hdr.indexOf("TOTAL AMOUNT"),
        who:hdr.indexOf("SALES ASSOCIATE 1 NAME"),cat:hdr.indexOf("CATEGORY"),brick:hdr.indexOf("BRICK"),fit:hdr.indexOf("FIT"),
        cls:hdr.indexOf("CLASS"),sub:hdr.indexOf("SUB CLASS"),pc9:hdr.indexOf("PC9"),code:hdr.indexOf("PRODUCT CODE"),desc:hdr.findIndex(x=>x.indexOf("ITEM DESC")===0)};
      const txt=v=>{const s=String(v??"").trim();return s&&!s.startsWith("#")&&s!=="0"?s:"";};
      const add=(o,key,q,v)=>{const a=o[key]||(o[key]=[0,0]);a[0]+=q;a[1]+=v;};
      const days={};let lines=0,skippedNP=0;const billsD={},npD={};
      const CATK={"MENS TOPS":"MT","MENS BOTTOMS":"MB","WOMENS TOPS":"WT","WOMENS BOTTOMS":"WB"};
      for(let r=i+1;r<rows.length;r++){
        const row=rows[r];if(!row)continue;
        const date=normDate(row[c.date]);if(!date||date>todayISO())continue;
        {const cuB=c.cat>=0?String(row[c.cat]??"").trim().toUpperCase():"";
         if(cuB!=="NP"){const B=(billsD[date]=billsD[date]||{});const tnB=String(row[c.tn]??"");const b=B[tnB]||(B[tnB]={t:0,w:{},q:{}});
           const aB=num(row[c.amt]);b.t+=aB;const wn=c.who>=0?String(row[c.who]??"").trim():"";if(wn)b.w[wn]=(b.w[wn]||0)+Math.abs(aB)+0.001;
           const kB=CATK[cuB];if(kB)b.q[kB]=(b.q[kB]||0)+num(row[c.qty]);
           if(cuB.indexOf("ACCESS")>-1){const qA=num(row[c.qty]);const tA=[c.cls,c.sub,c.brick,c.desc].map(ix=>ix>=0?String(row[ix]??""):"").join(" ").toUpperCase();
             const kA=/BELT/.test(tA)?"BL":/WALLET|WLT/.test(tA)?"WL":"";b.q.AQ=(b.q.AQ||0)+qA;b.q.AV=(b.q.AV||0)+aB;if(kA){b.q[kA+"Q"]=(b.q[kA+"Q"]||0)+qA;b.q[kA+"V"]=(b.q[kA+"V"]||0)+aB;}}}}
        if(c.cat>=0&&String(row[c.cat]??"").trim().toUpperCase()==="NP"){const n=npD[date]||(npD[date]={q:0,v:0,t:{}});n.q+=num(row[c.qty]);n.v+=num(row[c.amt]);n.t[String(row[c.tn]??"")]=1;}
        if(c.cat>=0){const cu=String(row[c.cat]??"").trim().toUpperCase();if(cu==="NP"||cu.indexOf("ACCESS")>-1){skippedNP++;continue;}}
        const qty=num(row[c.qty]),amt=num(row[c.amt]),tn=String(row[c.tn]??"");
        const d=days[date]||(days[date]={sales:0,units:0,tq:{},staff:{},mix:{c:{},b:{},f:{},s:{},p:{}}});
        const cat=c.cat>=0?(txt(row[c.cat])||"Other"):"All";
        const brick=(c.brick>=0&&txt(row[c.brick]))||[c.cls>=0?txt(row[c.cls]):"",c.sub>=0?txt(row[c.sub]):""].filter(Boolean).join(" · ")||"Other";
        const fit=(c.fit>=0&&txt(row[c.fit]))||"Other";
        add(d.mix.c,cat,qty,amt);add(d.mix.b,cat+"|"+brick.toUpperCase(),qty,amt);add(d.mix.f,cat+"|"+String(fit).toUpperCase(),qty,amt);
        d.sales+=amt;d.units+=qty;d.tq[tn]=(d.tq[tn]||0)+qty;
        {let pc=c.pc9>=0?String(row[c.pc9]??"").trim().toUpperCase():"";
         if(!/^[0-9A-Z]{5}-[0-9A-Z]{4}$/.test(pc)&&c.code>=0){const pcode=String(row[c.code]??"").trim().toUpperCase();if(/^[0-9A-Z]{9,}$/.test(pcode))pc=pcode.slice(0,5)+"-"+pcode.slice(5,9);}
         if(/^[0-9A-Z]{5}-[0-9A-Z]{4}$/.test(pc)){const a=d.mix.p[pc]||(d.mix.p[pc]=[0,0,""]);a[0]+=qty;a[1]+=amt;a[2]=cat+"|"+brick.toUpperCase();}}
        const who=c.who>=0?String(row[c.who]??"").trim():"";
        if(who){const s=d.staff[who]||(d.staff[who]={sales:0,units:0,tq:{}});s.sales+=amt;s.units+=qty;s.tq[tn]=(s.tq[tn]||0)+qty;
          add(d.mix.s[who]||(d.mix.s[who]={}),cat,qty,amt);}
        lines++;
      }
      const bills=tq=>Object.values(tq).filter(q=>q>0).length;
      const out={};
      Object.keys(days).forEach(dt=>{const d=days[dt];const st={};
        Object.keys(d.staff).forEach(n=>{const s=d.staff[n];st[n]={sales:Math.round(s.sales*100)/100,units:s.units,bills:bills(s.tq)};});
        const rnd=o=>{Object.keys(o).forEach(k=>{o[k]=[o[k][0],Math.round(o[k][1])];});return o;};
        rnd(d.mix.c);rnd(d.mix.b);rnd(d.mix.f);Object.values(d.mix.s).forEach(rnd);
        const bl=Object.values(billsD[dt]||{}).map(b=>{const who=Object.keys(b.w).sort((x,y)=>b.w[y]-b.w[x])[0]||"";const r0=x=>Math.round(b.q[x]||0);return [who,Math.round(b.t),b.q.MT||0,b.q.MB||0,b.q.WT||0,b.q.WB||0,b.q.AQ||0,r0("AV"),b.q.BLQ||0,r0("BLV"),b.q.WLQ||0,r0("WLV")];});
        const npx=npD[dt];
        out[dt]={np:npx?[npx.q,Math.round(npx.v),Object.keys(npx.t).length]:[0,0,0],sales:Math.round(d.sales*100)/100,units:d.units,bills:bills(d.tq),staff:st,mix:d.mix,bl};});
      if(!Object.keys(out).length) throw new Error("The report has no sales lines with a date.");

}

function normHdr(x){return String(x??"").replace(/_x000d_/gi," ").replace(/\s+/g," ").trim().toUpperCase();}
function isSohBook(XLSX,wb){
  for(const n of wb.SheetNames){const rows=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:null,range:0});
    for(let i=0;i<Math.min(15,rows.length);i++){const hd=(rows[i]||[]).map(normHdr);if(hd.some(x=>x.includes("ONHAND"))&&hd.includes("CATEGORY"))return true;}}
  return false;
}
function parseX30(XLSX,wb){
  const names=[...wb.SheetNames].sort((a,b)=>(/x30|onhand/i.test(b)?1:0)-(/x30|onhand/i.test(a)?1:0));
  for(const name of names){
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,raw:true,defval:null});
    for(let i=0;i<Math.min(15,rows.length);i++){
      const hd=(rows[i]||[]).map(normHdr);
      const qi=hd.findIndex(x=>x.includes("ONHAND"));const ci=hd.indexOf("CATEGORY");
      if(qi<0||ci<0)continue;
      const col_=n=>hd.indexOf(n);
      const c={pc9:col_("PC9"),code:col_("PRODUCT CODE"),brick:col_("BRICK"),fit:col_("FIT"),dis:col_("DIS"),cls:col_("CLASS"),
        sub:col_("SUBCLASS")>=0?col_("SUBCLASS"):col_("SUB CLASS"),price:hd.findIndex(x=>x.includes("RETAIL PRICE"))};
      const txt=v=>{const s=String(v??"").trim();return s&&!s.startsWith("#")&&s!=="0"?s:"";};
      const L={c:{},b:{},f:{}};const tot={q:0,v:0,dis:0,opts:{}};
      const bump=(o,key,pc,q,v,isDis)=>{const a=o[key]||(o[key]={q:0,v:0,dis:0,opts:{}});a.q+=q;a.v+=v;if(isDis)a.dis+=q;if(q>0)a.opts[pc]=(a.opts[pc]||0)+1;};
      let lines=0;
      for(let r=i+1;r<rows.length;r++){
        const row=rows[r];if(!row)continue;
        const cat=txt(row[ci]);if(!cat||cat.toUpperCase()==="NP"||cat.toUpperCase().indexOf("ACCESS")>-1)continue;
        const q=num(row[qi]);if(!q)continue;
        const code=String(row[c.code]??"");
        const pc=txt(row[c.pc9])||(code.length>=9?code.slice(0,5)+"-"+code.slice(5,9):code);
        const brick=((c.brick>=0&&txt(row[c.brick]))||[c.cls>=0?txt(row[c.cls]):"",c.sub>=0?txt(row[c.sub]):""].filter(Boolean).join(" · ")||"Other").toUpperCase();
        const fit=String((c.fit>=0&&txt(row[c.fit]))||"Other").toUpperCase();
        const v=q*num(c.price>=0?row[c.price]:0);const isDis=c.dis>=0&&/distress/i.test(String(row[c.dis]??""));
        bump(L.c,cat,pc,q,v,isDis);bump(L.b,cat+"|"+brick,pc,q,v,isDis);bump(L.f,cat+"|"+fit,pc,q,v,isDis);
        tot.q+=q;tot.v+=v;if(isDis)tot.dis+=q;if(q>0)tot.opts[pc]=(tot.opts[pc]||0)+1;lines++;
      }
      if(!lines) throw new Error("The stock report has no on-hand quantities.");
      const pack=a=>{const o=Object.values(a.opts);return [a.q,Math.round(a.v),o.length,o.filter(n=>n<=2).length,a.dis];};
      const out={date:todayISO(),c:{},b:{},f:{}};
      ["c","b","f"].forEach(l=>Object.keys(L[l]).forEach(k=>{out[l][k]=pack(L[l][k]);}));
      out.tot=pack(tot);out.lines=lines;
      return out;
    }
  }
  throw new Error("This doesn't look like an X30 on-hand report. It needs CATEGORY and ONHAND QTY columns.");
}

/* ---------- DSR (YTD daily sales report) ---------- */
function isDsrBook(XLSX,wb){
  for(const n of wb.SheetNames){const rows=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:null});
    for(let i=0;i<Math.min(6,rows.length);i++){const hd=(rows[i]||[]).map(normHdr);if(hd.includes("APPAREL")&&hd.includes("W-INS"))return true;}}
  return false;
}
function parseDsr(XLSX,wb){
  const days={};
  for(const n of wb.SheetNames){
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:null});
    for(let i=0;i<Math.min(6,rows.length);i++){
      const hd=(rows[i]||[]).map(normHdr);
      if(!(hd.includes("APPAREL")&&hd.includes("W-INS")))continue;
      const starts=[];hd.forEach((x,c)=>{if(x==="APPAREL"&&hd[c+2]==="TRX"&&hd[c+3]==="W-INS")starts.push(c);});
      for(const c of starts){
        for(let r=i+2;r<rows.length;r++){
          const row=rows[r]||[];
          const lbl=String(row[c-3]??"").toUpperCase();
          if(/TOTAL|^MONTH|^WEEK$/.test(lbl.trim()))break;
          const dt=normDate(row[c-1]);if(!dt||dt>todayISO())continue;
          const au=num(row[c]),ar=num(row[c+1]);if(!au&&!ar)continue;
          const cat=(k,u,v)=>[num(row[u]),Math.round(num(row[v]))];
          days[dt]={sales:Math.round(ar*100)/100,units:au,bills:num(row[c+2]),footfall:num(row[c+3]),
            mix:{"MENS TOPS":cat(0,c+4,c+5),"MENS BOTTOMS":cat(0,c+6,c+7),"WOMENS TOPS":cat(0,c+8,c+9),"WOMENS BOTTOMS":cat(0,c+10,c+11)}};
        }
      }
      break;
    }
  }
  if(!Object.keys(days).length) throw new Error("No daily sales rows found in this DSR file.");
  return days;
}
async function doDsrImport(){

async function handleX24File(file){
  ui.x24={loading:true};render();
  try{
    const XLSX=await loadXLSX();
    const buf=await file.arrayBuffer();
    const wb=XLSX.read(buf,{type:"array",cellDates:true});
    if(isDsrBook(XLSX,wb)){const dsr=parseDsr(XLSX,wb);ui.x24={type:"dsr",file:file.name,dsr};
      const ms=[...new Set(Object.keys(dsr).map(d=>d.slice(0,7)))];await Promise.all(ms.map(loadX24));render();return;}
    if(isStBook(XLSX,wb)){const st=parseStRep(XLSX,wb);ui.x24={type:"st",file:file.name,st};render();return;}
    if(isSohBook(XLSX,wb)){const soh=parseX30(XLSX,wb);ui.x24={type:"soh",file:file.name,soh};render();return;}
    const parsed=parseX24(XLSX,wb);
    const dates=Object.keys(parsed.days).sort();
    const tot={sales:0,units:0,bills:0},people={};
    dates.forEach(dt=>{const d=parsed.days[dt];tot.sales+=d.sales;tot.units+=d.units;tot.bills+=d.bills;
      Object.keys(d.staff).forEach(n=>{const p=people[n]||(people[n]={sales:0,units:0,bills:0});const s=d.staff[n];p.sales+=s.sales;p.units+=s.units;p.bills+=s.bills;});});
    ui.x24={file:file.name,parsed,dates,tot,people:Object.keys(people).map(n=>({name:n,...people[n],match:matchStaff(n)})).sort((a,b)=>b.sales-a.sales)};
  }catch(e){ui.x24={error:e.message||"Could not read this file."};}
  render();
}

async function handleLyFile(file){

    let raw={},kind="X24 Sales Transactions";
    if(isDsrBook(XLSX,wb)){kind="DSR";const d=parseDsr(XLSX,wb);Object.keys(d).forEach(dt=>{raw[dt]=[num(d[dt].sales),num(d[dt].units),num(d[dt].bills)];});}

      if(!ok) throw err||new Error("No sales lines found.");}
    const cutoff=isoOf(fyStart(Number(weekOfDate(new Date()).slice(0,4))));
    const days={};let skipped=0;Object.keys(raw).forEach(dt=>{if(dt<cutoff){const r=raw[dt];days[dt]=[Math.round(r[0]*100)/100,r[1],r[2]];}else skipped++;});
    ui.ly={kind,file:file.name,days,skipped,cutoff};
  }catch(e){ui.ly={error:e.message||"Could not read this file."};}
  render();
}

async function removeFutureSales(){

    Object.keys(c.days).forEach(dt=>{if(dt>today||(dt===today&&c.days[dt].source==="dsr")){amt+=num(c.days[dt].sales);n++;wks.add(weekOfDate(dOf(dt)));dayWks.add(weekOfDate(dOf(dt)));fms.add(monthOfDate(dOf(dt)));delete c.days[dt];ch=true;}});
    if(ch)persistX24(mk);}

  for(let i=0;i<70;i++){const m=await loadMix(wk);let ch=false;Object.keys(m.days||{}).forEach(dt=>{if(dt>today||(dt===today&&dsrToday)){delete m.days[dt];ch=true;}});if(ch)persistMix(wk);wk=stepKey(wk,1);}
  const isFutureWk=w=>isoOf(weekRange(w)[0])>today;
  const keepOnly=r=>{const k={};["target","lySales"].forEach(f=>{if(r&&num(r[f]))k[f]=r[f];});return Object.keys(k).length?k:null;};
  for(const w of wks){const fy=fyOf(w);await loadWeeks(fy);const [s]=weekRange(w),objs=[];
    for(let i=0;i<7;i++){const dt=isoOf(new Date(s.getFullYear(),s.getMonth(),s.getDate()+i));if(dt>today)break;const c=await loadX24(dt.slice(0,7));if(c.days[dt])objs.push(c.days[dt]);}
    const r=(weekCache[fy]||{})[w];
    if(objs.length){mergeInto(w,sumDays(objs),"Fixed");}
    else if(r&&(r.source||isFutureWk(w)||w===weekOfDate(now))){if(num(r.sales)>0&&!dayWks.has(w)){n++;amt+=num(r.sales);}const k=keepOnly(r);if(k)weekCache[fy][w]=k;else delete weekCache[fy][w];persistWeeks(fy,"Fixed");}}
  for(const fm of fms){const [s,e]=fmRange(fm);const objs=await dayObjsBetween(s,e);const r=state.months[fm];
    if(objs.length){mergeInto(fm,sumDays(objs),"Fixed");}

}
function sumDays(dayObjs){
  const t={sales:0,units:0,bills:0,footfall:0,staff:{}};
  dayObjs.forEach(d=>{t.sales+=num(d.sales);t.units+=num(d.units);t.bills+=num(d.bills);t.footfall+=num(d.footfall);
    Object.keys(d.staff||{}).forEach(id=>{const s=t.staff[id]||(t.staff[id]={sales:0,units:0,bills:0});const v=d.staff[id];s.sales+=v.sales;s.units+=v.units;s.bills+=v.bills;});});
  t.sales=Math.round(t.sales);return t;
}
function mergeInto(k,t,msg){

const mixCache={},mixLoading={};
const LS_MIX="store-perf-mix-";
async function loadMix(wk){
  if(mixCache[wk]) return mixCache[wk];
  if(mixLoading[wk]) return mixLoading[wk];
  mixLoading[wk]=(async()=>{
    let d=null;
    try{const r=localStorage.getItem(LS_MIX+wk);if(r)d=JSON.parse(r);}catch(e){}
    if(col){try{const s=await col.doc("mix-"+wk).get();if(s.exists)d=JSON.parse(JSON.stringify(s.data()));}catch(e){}}
    d=d&&typeof d==="object"?d:{};if(!d.days||typeof d.days!=="object")d.days={};
    mixCache[wk]=d;return d;})();
  const pr=mixLoading[wk];pr.then(()=>{if(mixLoading[wk]===pr)delete mixLoading[wk];});
  return pr;
}
let mixChain=Promise.resolve();
function persistMix(wk){
  if(!canEdit())return;
  const snap=JSON.parse(JSON.stringify(mixCache[wk]));
  try{localStorage.setItem(LS_MIX+wk,JSON.stringify(snap));}catch(e){}
  mixChain=mixChain.then(async()=>{if(!col)return;try{await col.doc("mix-"+wk).set(snap);}catch(e){}});
}
function periodDates(k,ytd){
  let s,e;
  if(isDay(k)){s=dOf(k);e=dOf(k);}else if(isWeek(k)){[s,e]=weekRange(k);}else{[s,e]=fmRange(k);}
  if(ytd) s=fyStart(fyOf(k));
  return [s,e];
}
function weeksCovering(s,e){const out=[];let wk=weekOfDate(s);for(let i=0;i<60;i++){out.push(wk);const [ws,we]=weekRange(wk);if(we>=e)break;wk=stepKey(wk,1);}return out;}
function mixFor(k,ytd){const [s,e]=periodDates(k,ytd);return mixBetween(s,e);}
function mixBetween(s,e){
  const wks=weeksCovering(s,e);
  const missing=wks.filter(w=>!mixCache[w]);
  if(missing.length){Promise.all(missing.map(loadMix)).then(()=>{if((ui.tab==="months"&&(ui.report==="mix"||ui.report==="st"))||ui.tab==="staff")render();});return null;}
  const si=isoOf(s),ei=isoOf(e);const t={c:{},b:{},f:{},s:{},days:0};
  const add=(o,key,a)=>{const x=o[key]||(o[key]=[0,0]);x[0]+=a[0];x[1]+=a[1];};
  wks.forEach(w=>{const days=mixCache[w].days;Object.keys(days).forEach(dt=>{if(dt<si||dt>ei)return;const d=days[dt];t.days++;
    ["c","b","f"].forEach(l=>Object.keys(d[l]||{}).forEach(key=>add(t[l],key,d[l][key])));
    Object.keys(d.s||{}).forEach(id=>{const o=t.s[id]||(t.s[id]={});Object.keys(d.s[id]).forEach(cat=>add(o,cat,d.s[id][cat]));});});});
  return t;
}

/* ---------- bill-level data (promo, category UPT) ---------- */
const billCache={},billLoading={};
const LS_BILL="store-perf-bills-";
function loadBills(wk){
  if(billCache[wk]) return Promise.resolve(billCache[wk]);
  if(billLoading[wk]) return billLoading[wk];
  billLoading[wk]=(async()=>{let d=null;
    try{const r=localStorage.getItem(LS_BILL+wk);if(r)d=JSON.parse(r);}catch(e){}
    if(col){try{const s=await col.doc("bills-"+wk).get();if(s.exists)d=JSON.parse(JSON.stringify(s.data()));}catch(e){}}
    d=d&&typeof d==="object"?d:{};
    const days={};Object.keys(d.days||{}).forEach(dt=>{const v=d.days[dt];days[dt]=typeof v==="string"?JSON.parse(v):v;});
    billCache[wk]={days};delete billLoading[wk];return billCache[wk];})();
  return billLoading[wk];
}
function persistBills(wk){
  if(!canEdit())return;const days={};Object.keys(billCache[wk].days).forEach(dt=>days[dt]=JSON.stringify(billCache[wk].days[dt]));
  const doc={days};try{localStorage.setItem(LS_BILL+wk,JSON.stringify(doc));}catch(e){}
  if(col) col.doc("bills-"+wk).set(doc).catch(()=>{});
}
function billsBetween(s,e){
  const wks=weeksCovering(s,e);const miss=wks.filter(w=>!billCache[w]);
  if(miss.length){Promise.all(miss.map(loadBills)).then(()=>{if(ui.tab==="months"||ui.tab==="home")render();});return null;}
  const si=isoOf(s),ei=isoOf(e);const out=[];let days=0;
  wks.forEach(w=>Object.keys(billCache[w].days).forEach(dt=>{if(dt<si||dt>ei)return;days++;billCache[w].days[dt].forEach(b=>out.push(b));}));
  return {bills:out,days};
}
function staffName(id){const s=state.staff.find(x=>x.id===id);return s?s.name:"Other";}
function rangeLabel(s,e){const f=d=>d.getDate()+" "+MN[d.getMonth()];return f(s)+" – "+f(e);}

    <div class="grid"><div class="kv"><span>Acc con% (value)</span><b class="up">${pc(T.av,T.val)}</b><small class="muted">${inr(T.av)} of ${inr(T.val)}</small></div>
    <div class="kv"><span>Acc con% (qty)</span><b>${pc(T.aq,T.aq+T.app)}</b><small class="muted">${full(T.aq)} of ${full(T.aq+T.app)} QTY</small></div>

const stWeekCache={};

function parseStRep(XLSX,wb){

function stPerWeeks(pk,per){if(per==="month"){const fy=fyOf(pk),[a,b]=fmWeeks(pk);const o=[];for(let n=a;n<=b;n++)o.push(weekKey(fy,n));return o;}

function todayISO(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function addDays(iso,n){const [y,m,d]=iso.split("-").map(Number);const t=new Date(y,m-1,d+n);return t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0");}
function dayLabel(iso){const [y,m,d]=iso.split("-").map(Number);return new Date(y,m-1,d).toLocaleDateString("en-IN",{weekday:"long",day:"numeric",month:"long"});}
function shortDate(iso){const [y,m,d]=iso.split("-").map(Number);return d+" "+MN[m-1];}
function nowHM(){const d=new Date();return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");}
function mins(t){if(!t)return NaN;const [h,m]=String(t).split(":").map(Number);return isFinite(h)&&isFinite(m)?h*60+m:NaN;}
function hrs(a,b){const x=mins(a),y=mins(b);if(!isFinite(x)||!isFinite(y))return NaN;let d=y-x;if(d<0)d+=1440;return d/60;}
function fmtH(h){if(!isFinite(h))return "–";const H=Math.floor(h),M=Math.round((h-H)*60);return H+"h "+String(M).padStart(2,"0")+"m";}
function t12(t){const x=mins(t);if(!isFinite(x))return "";let h=Math.floor(x/60),m=x%60;const ap=h>=12?"PM":"AM";h=h%12||12;return h+":"+String(m).padStart(2,"0")+" "+ap;}
function attStatus(r){if(!r)return "";if(r.status==="L"||r.status==="A")return "L";if(r.status==="WO")return "WO";if(r.status==="P"||r.in)return "P";return "";}
function isLate(r){return r&&!r.status&&r.in&&mins(r.in)>mins(state.settings?.lateAfter||"10:15");}

async function loadDay(mk){
  if(dayCache[mk]) return dayCache[mk];
  let d=null;
  try{const r=localStorage.getItem(LS_DAY+mk);if(r)d=JSON.parse(r);}catch(e){}
  if(col){try{const s=await col.doc("day-"+mk).get();if(s.exists)d=JSON.parse(JSON.stringify(s.data()));}catch(e){}}
  d=d&&typeof d==="object"?d:{};
  if(!d.att||typeof d.att!=="object")d.att={};
  if(!Array.isArray(d.vm))d.vm=[];
  dayCache[mk]=d; return d;
}
let dayChain=Promise.resolve();
function persistDay(mk,msg){
  if(!canEdit())return;
  const snap=JSON.parse(JSON.stringify(dayCache[mk]));
  try{localStorage.setItem(LS_DAY+mk,JSON.stringify(snap));}catch(e){}
  dayChain=dayChain.then(async()=>{
    if(!col){toast(msg||"Saved");return;}
    try{await col.doc("day-"+mk).set(snap);setStatus("Synced");toast(msg||"Saved");}
    catch(e){setStatus("Saved on this device only");toast("Saved on this device — sync failed");}
  });
}

        c.getContext("2d").drawImage(img,0,0,c.width,c.height);const d=c.toDataURL("image/jpeg",q);
        if(d.length>700000&&max>500){max=Math.round(max*0.8);q=Math.max(0.5,q-0.08);return go();}URL.revokeObjectURL(url);res(d);};go();};

  if(fsdb){const ref=await fsdb.collection("stores/"+SID+"/vmphotos").add(rec);rec.id=ref.id;}
  else{rec.id="game_"+Date.now();const l=gzLocal("game");l.push(rec);gzSaveLocal("game",l);}
  (gz.wk[rec.gwk]=gz.wk[rec.gwk]||[]).push(rec);}
function gzPlayer(){return {by:myUid(),name:myName||(role==="admin"?"Manager":"Staff")};}
function gzCanPlay(){return canPhoto()||!fsdb;}
function gzBoard(wk){gzLoadWeek(wk);const l=gz.wk[wk];if(!l)return null;const m={};
  l.forEach(g=>{const o=m[g.by]||(m[g.by]={by:g.by,name:g.name,pts:0,days:new Set()});o.pts+=num(g.pts);o.days.add(g.date);o.name=g.name||o.name;});
  return Object.values(m).map(o=>({...o,days:o.days.size})).sort((a,b)=>b.pts-a.pts||b.days-a.days);}
function gzBest(game){try{return +localStorage.getItem("store-perf-gzbest-"+game)||0;}catch(e){return 0;}}
function gzSetBest(game,v){try{if(v>gzBest(game))localStorage.setItem("store-perf-gzbest-"+game,String(v));}catch(e){}}

/* the winner of yesterday (or the day before) is asked for a selfie */
function gzPendingWin(){if(!gzCanPlay())return null;gzLoadSelfies();if(!gz.sf)return null;
  for(const back of [1,2]){const d=new Date();d.setDate(d.getDate()-back);const iso=isoOf(d);const w=gzWinner(iso);
    if(!w||w.by!==myUid())continue;if(gz.sf.some(p=>p.date===iso&&p.by===myUid()))continue;if(gz.dismiss[iso])continue;return {iso,w,back};}
  return null;}

function gzSelfieSquare(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file);const im=new Image();
  im.onload=()=>{const N=480,c=document.createElement("canvas");c.width=c.height=N;const sc=Math.max(N/im.width,N/im.height);c.getContext("2d").drawImage(im,(N-im.width*sc)/2,(N-im.height*sc)/2,im.width*sc,im.height*sc);URL.revokeObjectURL(u);res(c.toDataURL("image/jpeg",.78));};
  im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error("Could not read photo"));};im.src=u;});}

      const rec={kind:"selfie",taskId:"",taskTitle:"🏆 Winner selfie",date:iso,sweek:gzWkOf(iso),by:myUid(),name:w.name,img,label,cap:o.querySelector("#gzCap").value.trim(),likes:[],at:nowStamp()};

        (gz.sf=gz.sf||[]).unshift(rec);o.hidden=true;toast("Posted to the Winners Wall 🎉");ui.trnPage="games";go("learn");}

async function gzToggleLike(id){const p=(gz.sf||[]).find(x=>x.id===id);if(!p||!gzCanPlay())return;
  const me=myUid(),key=me+"|"+(myName||(role==="admin"?"Manager":"Staff"));const L=p.likes||[];const had=L.find(x=>String(x).split("|")[0]===me);
  const next=had?L.filter(x=>x!==had):L.concat([key]);
  try{if(fsdb){const FV=firebase.firestore.FieldValue;await fsdb.doc("stores/"+SID+"/vmphotos/"+id).update({likes:had?FV.arrayRemove(had):FV.arrayUnion(key)});}
    else{const l=gzLocal("selfie");const q=l.find(x=>x.id===id);if(q){q.likes=next;gzSaveLocal("selfie",l);}}

async function gzDelSelfie(id){try{if(fsdb)await fsdb.doc("stores/"+SID+"/vmphotos/"+id).delete();else gzSaveLocal("selfie",gzLocal("selfie").filter(x=>x.id!==id));

function gzOverlay(id){let o=document.getElementById(id);if(!o){o=document.createElement("div");o.id=id;o.className="overlay";o.hidden=true;document.body.appendChild(o);}return o;}

/* ---------- the games ---------- */
const G={};
function gzStart(game){const Q=gzQuestions();if(Q.length<3){toast("No questions yet");return;}
  let o=document.getElementById("gzGame");
  if(!o){o=document.createElement("div");o.id="gzGame";o.className="gzov";document.body.appendChild(o);}
  o.innerHTML=`<div class="gzapp"><div class="gzstage"><canvas id="gzCv"></canvas>
      <div class="gzboard"><div class="gzsc"><div class="t" id="gzT1"></div><div class="v" id="gzScore">0</div></div><div class="gzsc" style="text-align:right"><div class="t" id="gzT2"></div><div class="gzballs" id="gzBalls"></div></div></div>
      <button class="gzx" id="gzClose" aria-label="Close game">✕</button><div class="gzbig" id="gzBig"></div></div>
    <div class="gzdeck"><div><small id="gzQn"></small><p id="gzQt"></p></div><div class="gzshots" id="gzShots"></div><p class="gzhint" id="gzHint"></p></div>
    <div class="gzend" id="gzEnd" hidden></div></div>`;
  o.hidden=false;document.body.style.overflow="hidden";
  Object.assign(G,{game,deck:gzShuffle(Q.slice()),i:0,right:0,wrong:0,pts:0,runs:0,log:[],miss:[],q:null,shownAt:0,A:{phase:"idle",t:0,crowd:0,net:0},on:true,last:performance.now(),counted:null});
  const mine=gzMyToday();G.countable=gzCanPlay()&&!mine;
  try{G.ac=G.ac||new (window.AudioContext||window.webkitAudioContext)();G.ac.resume&&G.ac.resume();}catch(e){}
  G.cv=o.querySelector("#gzCv");G.cx=G.cv.getContext("2d");gzSize();
  o.querySelector("#gzClose").onclick=gzClose;
  o.querySelector("#gzShots").onclick=e=>{const b=e.target.closest("[data-i]");if(b)gzAnswer(+b.dataset.i);};
  if(!G.crowd)G.crowd=Array.from({length:240},()=>({x:Math.random(),y:Math.random(),c:["#d3202f","#f2b632","#f4f1ec","#4aa3ff","#3fcf7a"][Math.random()*5|0],p:Math.random()*6}));
  gzNext();cancelAnimationFrame(G.raf);G.raf=requestAnimationFrame(gzLoop);}
function gzSize(){if(!G.cv)return;const d=Math.min(2,devicePixelRatio||1),st=G.cv.parentElement;G.W=st.clientWidth;G.H=st.clientHeight;G.cv.width=G.W*d;G.cv.height=G.H*d;G.cx.setTransform(d,0,0,d,0,0);}
addEventListener("resize",()=>{if(G.on)gzSize();});
function gzClose(){G.on=false;cancelAnimationFrame(G.raf);const o=document.getElementById("gzGame");if(o)o.hidden=true;document.body.style.overflow="";render();}
function gzTone(f,d,t,v){if(!G.ac)return;try{const o=G.ac.createOscillator(),g=G.ac.createGain();o.type=t||"triangle";o.frequency.value=f;g.gain.value=v||.06;o.connect(g);g.connect(G.ac.destination);const n=G.ac.currentTime;g.gain.exponentialRampToValueAtTime(.0001,n+d);o.start(n);o.stop(n+d);}catch(e){}}
const $g=id=>document.getElementById(id);
function gzBoardUI(){const c=G.game==="cricket";
  $g("gzT1").textContent=c?"PMC XI":"GOALS";$g("gzScore").textContent=c?G.runs+"/"+G.wrong:G.right+"/"+G.i;
  $g("gzT2").textContent=c?"OVER "+Math.min(2,Math.floor(G.i/6)+1)+" · "+Math.floor(G.i/6)+"."+(G.i%6):"KICK "+Math.min(GZ_N,G.i+1)+" OF "+GZ_N;
  const per=c?6:GZ_N,start=c?Math.floor(Math.max(0,G.i-1)/6)*6:0,cur=G.log.slice(start,start+per);
  $g("gzBalls").innerHTML=Array.from({length:per},(_,k)=>{const r=cur[k];return r===undefined?"<i></i>":r==="W"?'<i class="w">'+(c?"W":"✕")+'</i>':`<i class="${r==="6"||r==="2"?"r6":"r4"}">${c?r:"⚽"}</i>`;}).join("");}
function gzNext(){if(G.i>=GZ_N||G.wrong>=GZ_LIVES)return gzEnd();
  if(!G.deck.length)G.deck=gzShuffle(gzQuestions().slice());
  const [q,a,w]=G.deck.pop();const opts=gzShuffle([a,...w]);G.q={q,a,opts,ans:opts.indexOf(a)};
  $g("gzQn").textContent=(G.game==="cricket"?"BALL ":"KICK ")+(G.i+1)+" OF "+GZ_N;$g("gzQt").textContent=q;
  $g("gzShots").innerHTML=opts.map((o,i)=>`<button class="gzshot" data-i="${i}"><b>${"ABC"[i]}</b><span>${esc(o)}</span></button>`).join("");
  $g("gzHint").textContent=G.game==="cricket"?"Answer in "+GZ_FAST+" sec for a SIX, otherwise FOUR":"A = left · B = top centre · C = right";
  G.shownAt=performance.now();G.A={phase:"idle",t:0,crowd:G.A.crowd||0,net:0};gzBoardUI();}
function gzAnswer(i){if(G.A.phase!=="idle")return;const secs=(performance.now()-G.shownAt)/1000,ok=i===G.q.ans,fast=ok&&secs<=GZ_FAST;
  document.querySelectorAll(".gzshot").forEach((b,k)=>{b.disabled=true;b.classList.add(k===G.q.ans?"ok":k===i?"no":"dim");});
  $g("gzHint").textContent=ok?(fast?"Answered in "+secs.toFixed(1)+" sec · +15 pts":"Correct, took "+secs.toFixed(1)+" sec · +10 pts"):"Correct answer: "+G.q.a;
  G.A={phase:"runup",t:0,ok,fast,zone:i,keeperZone:ok?[0,1,2].filter(z=>z!==i)[Math.random()*2|0]:i,dir:Math.random()<.5?-1:1,crowd:G.A.crowd,net:0};}
function gzSettle(){const {ok,fast}=G.A;G.i++;
  if(ok){G.right++;G.pts+=fast?15:10;if(G.game==="cricket"){G.runs+=fast?6:4;G.log.push(fast?"6":"4");}else G.log.push(fast?"2":"1");}
  else{G.wrong++;G.log.push("W");G.miss.push(G.q);}gzBoardUI();}
function gzBigText(t,c,sub){const e=$g("gzBig");e.innerHTML=esc(t)+(sub?`<small>${esc(sub)}</small>`:"");e.style.color=c;e.classList.add("show");}
async function gzEnd(){G.A.phase="end";const c=G.game==="cricket";gzSetBest(G.game,c?G.runs:G.pts);
  let note="Practice game · today's score is already counted.";

    try{await gzSaveGame(rec);note="✓ Counted for today's leaderboard.";}catch(e){note=/permission/i.test(String(e.code||e.message))?"Not saved: not allowed. Update the database rules.":"Could not save your score.";}}
  const e=$g("gzEnd");
  e.innerHTML=`<div class="gzlogo">${c?(G.wrong>=GZ_LIVES?"ALL OUT":"INNINGS OVER"):"FULL TIME"}</div>
    <div class="gzfinal">${c?G.runs+"/"+G.wrong:G.right+" goals"}</div>
    <div class="gzstats"><div><b>${G.pts}</b>points</div><div><b>${G.right}/${G.i}</b>correct</div><div><b>${gzBest(G.game)}</b>best ${c?"runs":"pts"}</div></div>
    <p class="gzhint">${esc(note)}</p>
    ${G.miss.length?`<div class="gzreview"><h3>LEARN THESE</h3><ul>${G.miss.map(m=>`<li>${esc(m[0]||m.q)}<br><span>${esc(m.a)}</span></li>`).join("")}</ul></div>`:""}
    <div class="gzrow"><button class="gzgo" id="gzAgain">PLAY AGAIN</button><button class="gzbtn" id="gzDone">Close</button></div>`;
  e.hidden=false;$g("gzAgain").onclick=()=>gzStart(G.game);$g("gzDone").onclick=gzClose;render();}
function gzLoop(now){if(!G.on)return;const dt=Math.min(.05,(now-G.last)/1000);G.last=now;try{G.game==="cricket"?gzDrawCricket(dt):gzDrawFootball(dt);}catch(e){}G.raf=requestAnimationFrame(gzLoop);}
function gzRR(x,y,w,h,r){const c=G.cx;c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function gzCrowd(top,h,dt){const c=G.cx;G.A.crowd=Math.max(0,(G.A.crowd||0)-dt);
  G.crowd.forEach(d=>{const j=G.A.crowd>0?Math.abs(Math.sin(performance.now()/90+d.p))*4:0;c.fillStyle=d.c;c.globalAlpha=.75;c.fillRect(d.x*G.W,top+d.y*h-j,3,3);});c.globalAlpha=1;}
function gzTimerPill(y){if(G.A.phase!=="idle")return;const c=G.cx,left=Math.max(0,GZ_FAST-(performance.now()-G.shownAt)/1000);
  const t=left>0?(G.game==="cricket"?"SIX bonus ":"Top-bin bonus ")+left.toFixed(0)+"s":"Take your time";c.font="800 13px Barlow, sans-serif";const tw=c.measureText(t).width+20;
  c.fillStyle="rgba(8,14,11,.78)";gzRR(G.W/2-tw/2,y,tw,22,11);c.fill();c.fillStyle=left>0?"#f2b632":"#9fb3a7";c.textAlign="center";c.textBaseline="middle";c.fillText(t,G.W/2,y+11);}
function gzPerson(x,y,s,shirt,pose,bat){const c=G.cx;c.save();c.translate(x,y);c.scale(s,s);
  c.fillStyle="rgba(0,0,0,.28)";c.beginPath();c.ellipse(0,2,14,4,0,0,7);c.fill();c.strokeStyle="#1b2a4a";c.lineWidth=5;c.lineCap="round";const lp=pose||0;
  c.beginPath();c.moveTo(-3,-22);c.lineTo(-6-lp*4,0);c.moveTo(3,-22);c.lineTo(6+lp*4,0);c.stroke();
  c.fillStyle=shirt;gzRR(-8,-44,16,24,5);c.fill();c.fillStyle="#c98d64";c.beginPath();c.arc(0,-50,6,0,7);c.fill();c.fillStyle=shirt;c.fillRect(-7,-57,14,5);
  if(bat!==undefined){c.save();c.translate(6,-34);c.rotate(bat);c.fillStyle="#e9cf98";c.fillRect(-2,0,5,30);c.fillStyle="#7a4b2a";c.fillRect(-1.5,-8,4,9);c.restore();}c.restore();}
function gzStumps(x,y,s,fly){const c=G.cx;c.save();c.translate(x,y);c.scale(s,s);c.fillStyle="#f4ead2";
  [-7,0,7].forEach((dx,i)=>{c.save();if(fly){c.translate(dx,0);c.rotate((i-1)*0.5*fly);c.translate(-dx,0);}c.fillRect(dx-1.5,-30,3,30);c.restore();});
  c.fillStyle="#d3202f";if(fly){c.fillRect(-9-fly*30,-34-fly*40,8,3);c.fillRect(2+fly*28,-36-fly*34,8,3);}else{c.fillRect(-8,-32,7,3);c.fillRect(1,-32,7,3);}c.restore();}
function gzDrawCricket(dt){const c=G.cx,W=G.W,H=G.H,A=G.A;const top=H*0.30,bot=H*0.93,cxm=W/2,wT=W*0.07,wB=W*0.26;const P=f=>({x:cxm,y:top+(bot-top)*f,w:wT+(wB-wT)*f});
  const sky=c.createLinearGradient(0,0,0,top);sky.addColorStop(0,"#06100b");sky.addColorStop(1,"#12301f");c.fillStyle=sky;c.fillRect(0,0,W,H);

async function pdfLines(pdf){const lines=[];
  for(let p=1;p<=pdf.numPages;p++){const pg=await pdf.getPage(p);const tc=await pg.getTextContent();const rows=[];
    tc.items.forEach(it=>{if(!it.str||!it.str.trim())return;const y=Math.round(it.transform[5]);let r=rows.find(r=>Math.abs(r.y-y)<4);if(!r){r={y,parts:[]};rows.push(r);}r.parts.push({x:it.transform[4],s:it.str});});

function splitMustKnows(lines){

    if(!cur)continue;
    if(!cur.a.length&&/^[a-z(]/.test(l)&&!/[?:]\s*$|\)\s*$|\.\s*$/.test(cur.q)&&cur.q.length<170){cur.q+=" "+l;continue;}
    const b=l.replace(bul,"").trim();if(!b)continue;
    if(bul.test(l)||/^[ivx]+[.)]\s/i.test(l)||/^[A-Z][^.]{0,40}:\s/.test(l)||!cur.a.length)cur.a.push(b);else cur.a[cur.a.length-1]+=" "+b;}

/* PC9 photos added in the app: 16 small docs pcimg-0 … pcimg-f, { img: { "A4411-0031": dataURL } } */
const pcUser={};let pcUserLoaded=false;
function pcBucket(pc){let h=0;for(const ch of pc)h=(h*31+ch.charCodeAt(0))>>>0;return "pcimg-"+(h%16).toString(16);}
function loadPcUser(){if(pcUserLoaded)return;pcUserLoaded=true;
  Promise.all(Array.from({length:16},(_,i)=>fsGet("pcimg-"+i.toString(16)))).then(ds=>{ds.forEach(d=>{if(d&&d.img)Object.assign(pcUser,d.img);});if(ui.tab==="st")render();});}
function pc9FromName(n){const m=String(n).toUpperCase().match(/([0-9A-Z]{5})[-_ .]?([0-9A-Z]{4})/);return m?m[1]+"-"+m[2]:"";}
function smallPhoto(file){return new Promise((res,rej)=>{const url=URL.createObjectURL(file);const img=new Image();
  img.onload=()=>{const sc=Math.min(1,360/img.height,240/img.width);const c=document.createElement("canvas");c.width=Math.max(1,Math.round(img.width*sc));c.height=Math.max(1,Math.round(img.height*sc));
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);res(c.toDataURL("image/jpeg",0.72));};
  img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error("Could not read "+file.name));};img.src=url;});}
async function savePcPhotos(map){const by={};Object.keys(map).forEach(pc=>{(by[pcBucket(pc)]=by[pcBucket(pc)]||{})[pc]=map[pc];});
  for(const b of Object.keys(by))await fsSet(b,{img:by[b]},true);Object.assign(pcUser,map);}
function pickFiles(accept,multi,fn){const i=document.createElement("input");i.type="file";i.accept=accept;i.multiple=!!multi;i.style.display="none";document.body.appendChild(i);
  i.addEventListener("change",()=>{const f=[...i.files];i.remove();if(f.length)fn(f);});i.click();}
async function addPcPhotos(files,forPc){
  const map={};let skip=[];toast("Adding photos…");
  for(const f of files){
    if(/\.json$/i.test(f.name)){try{const j=JSON.parse(await f.text());const fmt=j.fmt||"webp";Object.keys(j.img||{}).forEach(pc=>{map[pc.toUpperCase()]="data:image/"+(fmt==="jpg"?"jpeg":fmt)+";base64,"+j.img[pc];});}catch(e){skip.push(f.name);}continue;}
    const pc=forPc||pc9FromName(f.name);if(!pc){skip.push(f.name);continue;}
    try{map[pc]=await smallPhoto(f);}catch(e){skip.push(f.name);}}
  const n=Object.keys(map).length;
  if(n){try{await savePcPhotos(map);}catch(e){toast("Save failed: "+(e.message||e));return;}}
  render();setTimeout(()=>toast(n+" photo"+(n===1?"":"s")+" saved ✓"+(skip.length?" · "+skip.length+" skipped (no PC9 in the file name)":"")),300);}

function quickTargets(mode){
  if(mode==="pct"){const ft=document.getElementById("f_target"),qt=document.getElementById("qtTotal");if(!num(ft.value)&&num(qt.value))ft.value=num(qt.value);
    const r=applyPctTargets();if(!r.total){toast("Enter the store target first");qt.focus();return;}if(!r.tp){toast("Type each person's % in Staff numbers below");return;}
    toast(Math.abs(r.tp-100)<0.05?"Targets split by % — check and Save":"Split done, but total % is "+Math.round(r.tp*10)/10);return;}
  const k=cur(),rows=[...document.querySelectorAll(".srow")];if(!rows.length)return;
  const ids=rows.map(r=>r.dataset.sid);
  const rnd=document.getElementById("qtRound").checked?(v=>Math.round(v/1000)*1000):(v=>Math.round(v));
  const setT=(id,v)=>{const i=document.querySelector(`.srow[data-sid="${id}"] [data-k="target"]`);if(i)i.value=v>0?v:"";};
  if(mode==="copy"){const p=rec(stepKey(k,-1));if(!p||!p.staff){toast("No targets in "+mShort(stepKey(k,-1)));return;}

  let share={};

    const nz=ids.filter(id=>share[id]>0);if(!nz.length){toast("No past staff sales yet — splitting equally");mode="equal";}
    else{const avg=sum/nz.length;ids.forEach(id=>{if(!share[id])share[id]=avg;});sum=ids.reduce((s,id)=>s+share[id],0);ids.forEach(id=>share[id]/=sum);}}
  if(mode==="equal")ids.forEach(id=>share[id]=1/ids.length);
  ids.forEach(id=>setT(id,rnd(total*share[id])));
  if(!num(document.getElementById("f_target").value))document.getElementById("f_target").value=total;
  toast("Targets filled — check and Save");

    case "exportCsv":exportCsv();break;
    case "x24Import":doImport();break;
    case "x24Cancel":ui.x24=null;render();break;
    case "dsrImport":doDsrImport();break;
    case "lyCancel":ui.ly=null;render();break;
    case "sdelAll":{const l=state.staff.filter(s=>s.active===false&&!s.deleted);askConfirm("Delete all "+l.length+" removed staff permanently?","Delete all",()=>{l.forEach(s=>s.deleted=true);persist(l.length+" staff deleted");render();});break;}
    case "futFix":askConfirm("Remove all sales saved on dates after today?","Remove",()=>{removeFutureSales();});break;
    case "lyImport":if(ui.ly&&ui.ly.days){const n=Object.keys(ui.ly.days).length;Object.assign(lyStore.days,ui.ly.days);ui.ly=null;saveLy("LY imported: "+n+" days ✓");render();}break;
    case "lyClear":askConfirm("Clear all uploaded LY sales?","Clear",()=>{lyStore={days:{}};saveLy("LY cleared");render();});break;
    case "stImport":if(ui.x24&&ui.x24.st){saveStRep({...ui.x24.st,file:ui.x24.file});ui.x24=null;ui.tab="st";ui.stView="top";toast("ST report imported ✓");render();window.scrollTo(0,0);}break;
    case "sohImport":if(ui.x24&&ui.x24.soh){saveSoh(ui.x24.soh);ui.x24=null;ui.tab="months";ui.report="mix";toast("SOH imported ✓");render();window.scrollTo(0,0);}break;
    case "prevD":ui.day=addDays(ui.day,-1);delete photoCache[ui.day];render();break;
    case "nextD":ui.day=addDays(ui.day,1);delete photoCache[ui.day];render();break;
    case "saveLate":{const v=document.getElementById("lateAfter").value;state.settings=Object.assign({},state.settings,{lateAfter:v||"10:15"});persist("Late time saved");render();break;}
    case "vmAdd":{const i=document.getElementById("vmTitle");const title=i.value.trim();if(!title){i.focus();return;}
      const d=dayCache[ui.day.slice(0,7)];if(!d)return;
      d.vm.push({id:uid(),date:ui.day,title,sid:document.getElementById("vmWho").value||"",done:false});
      persistDay(ui.day.slice(0,7),"VM task added");render();break;}
  }
});
/* swipe slides */
{let sx=null;document.addEventListener("touchstart",e=>{sx=e.target.closest&&e.target.closest("#slideBox")?e.touches[0].clientX:null;},{passive:true});
 document.addEventListener("touchend",e=>{if(sx==null)return;const dx=e.changedTouches[0].clientX-sx;sx=null;if(Math.abs(dx)<40)return;
   const b=document.querySelector(`.monthbar [data-slide="${(num(ui.slide)||1)+(dx<0?1:-1)}"]:not([disabled])`);if(b)b.click();},{passive:true});}
document.addEventListener("change",e=>{
  const el=e.target;
  if(el.id==="vmPhotoFile"&&el.files&&el.files[0]){uploadVmPhoto(el.files[0]);el.value="";return;}
  if(!canEdit()&&el.id!=="dayPick")return;
  if(el.id==="backupFile"&&el.files&&el.files[0]){backupRestore(el.files[0]);el.value="";return;}
  if(el.id==="x24File"&&el.files&&el.files[0]){handleX24File(el.files[0]);return;}
  if(el.id==="lyFile"&&el.files&&el.files[0]){handleLyFile(el.files[0]);el.value="";return;}
  if((el.id==="tnLaunch"||el.id==="tnMk")&&el.files&&el.files[0]){const nm=document.getElementById("tnName"),fr=document.getElementById("tnFrom");ui.trnForm={name:nm?nm.value:"",from:fr?fr.value:""};trnFiles[el.id==="tnLaunch"?"launch":"mk"]=el.files[0];render();return;}
  if(el.id==="slideJump"){ui.slide=+el.value;render();return;}
  if(el.id==="dayPick"&&el.value){ui.day=el.value;delete photoCache[ui.day];render();return;}
  if(el.dataset.a){const row=el.closest(".arow");if(!row)return;
    const patch={};patch[el.dataset.a]=el.value;
    if(el.dataset.a==="status"&&el.value){patch.in="";patch.out="";}
    setAtt(row.dataset.sid,patch);return;}
  if(el.dataset.vmdone){const mk=ui.day.slice(0,7),d=dayCache[mk];const task=d?.vm.find(x=>x.id===el.dataset.vmdone);if(!task)return;
    task.done=el.checked;if(el.checked){task.doneAt=nowHM();task.doneOn=todayISO();}else{delete task.doneAt;delete task.doneOn;}
    persistDay(mk,el.checked?"VM work finished ✓":"Marked pending");render();}
});
document.addEventListener("toggle",e=>{const el=e.target;if(el&&el.dataset&&el.dataset.fold){foldState[el.dataset.fold]=el.open;try{localStorage.setItem("store-perf-fold",JSON.stringify(foldState));}catch(_){}}},true);
document.addEventListener("input",e=>{
  const el=e.target;if(!canEdit())return;
  if(el.id==="f_target"||el.id==="qtTotal")applyPctTargets();
  if(el.dataset&&el.dataset.spct!==undefined)applyPctTargets(el.dataset.spct);
  if(el.dataset&&el.dataset.pct!==undefined)updPctTotal();
});
document.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&e.target.id==="vmTitle"){e.preventDefault();document.getElementById("vmAdd").click();return;}
  if(e.key==="Enter"&&e.target.id==="newStaff"){e.preventDefault();document.getElementById("addStaff").click();}
});

/* ---------- start ---------- */
ui.month=monthOfDate(now);
try{const md=localStorage.getItem("store-perf-mode");if(md==="week"||md==="month"||md==="ytd")ui.mode=md;}catch(e){}
const local=loadLocal(); if(local) state=normalize(local);
setTimeout(()=>{if(!col&&!ui.gate)migrateFiscal();},1500);
render();
connect();
})();
</script>
